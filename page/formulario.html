<div id="formulario">
    <h2>Registro de usuario</h2>
  <form action="" id="RegistroForm">
    <div>
      <label for="username">Usuario</label>
      <br>
      <input type="text" name="username" id="username" placeholder="gato montes">
      <br>
      <small class="error" id="err-username"></small>
      <br>
    </div>

    <div>
      <label for="email">Email</label>
      <br>
      <input type="email" name="email" id="email" placeholder="correo@ejemplo.com">
      <br>
      <small class="error" id="err-email"></small>
      <br>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <br>
      <input type="password" name="password" id="password" placeholder="el nombre de tu ex ">
      <br>
      <small class="error" id="err-password"></small>
      <br>
    </div>

    <div>
      <label for="confirmPassword">Confirmar contraseña</label>
      <br>
      <input type="password" name="confirmPassword" id="confirmPassword" placeholder="el nombre de tu ex ">
      <br>
      <small class="error" id="err-confirmPassword"></small>
      <br>
    </div>

    <button type="submit">Crear cuenta</button>
    <br>
    <button type="reset">Limpiar</button>
  </form>
</div>
